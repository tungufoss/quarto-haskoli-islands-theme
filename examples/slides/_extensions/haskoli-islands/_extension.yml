title: Háskóli Íslands Theme
author: tungufoss
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    haskoli-islands-html:
      extends: html
      lang: en
      date-format: long
      citations-hover: true
      footnotes-hover: true
      theme:
        - cosmo
        - html.scss
      toc: true
      toc-location: right
      code-overflow: wrap
      link-external-icon: true
      smooth-scroll: true
      anchor-sections: true
    haskoli-islands-revealjs:
      extends: revealjs
      lang: en
      date-format: long
      citations-hover: true
      footnotes-hover: true
      theme:
        - simple
        - revealjs.scss
      slide-number: true
      controls: true
      progress: true
      transition: fade
      code-overflow: wrap
